name: Actualizar tormentas

# NHC no manda cabecera CORS en CurrentStorms.json, así que un navegador no puede
# leerlo directo. Este workflow lo jala del lado del servidor cada 30 minutos y lo
# deja como un archivo dentro del repo — la página lo lee del mismo origen.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: actualizar-tormentas
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bajar el feed de NHC
        run: |
          set -o pipefail
          curl --fail --silent --show-error --location \
            --max-time 30 \
            --user-agent "vigia-del-golfo/1.0 (github.com/mascochicle/experimentos)" \
            "https://www.nhc.noaa.gov/CurrentStorms.json" \
            -o /tmp/nhc.json
          echo "Bytes recibidos: $(wc -c < /tmp/nhc.json)"
          head -c 400 /tmp/nhc.json; echo

      - name: Armar datos/tormentas.json
        run: |
          mkdir -p datos
          node --input-type=module -e '
            import fs from "node:fs";
            const crudo = JSON.parse(fs.readFileSync("/tmp/nhc.json", "utf8"));
            const activas = Array.isArray(crudo.activeStorms) ? crudo.activeStorms : [];
            const limpio = activas.map(s => ({
              id: s.id,
              nombre: s.name,
              clasificacion: s.classification,
              cuenca: s.binNumber,
              intensidadKt: Number(s.intensity),
              presionMb: Number(s.pressure),
              lat: Number(s.latitudeNumeric),
              lon: Number(s.longitudeNumeric),
              rumboGrados: Number(s.movementDir),
              velocidadKt: Number(s.movementSpeed),
              actualizado: s.lastUpdate,
              avisoPublico: s.publicAdvisory?.url ?? null,
              graficas: s.forecastGraphics?.url ?? null
            }));
            const salida = {
              generado: new Date().toISOString(),
              fuente: "https://www.nhc.noaa.gov/CurrentStorms.json",
              total: limpio.length,
              tormentas: limpio
            };
            fs.writeFileSync("datos/tormentas.json", JSON.stringify(salida, null, 2) + "\n");
            console.log("Tormentas activas:", limpio.length);
            for (const t of limpio) {
              console.log(`  ${t.nombre} (${t.clasificacion}) ${t.intensidadKt}kt en ${t.lat},${t.lon}`);
            }
          '

      # --- Zonas de vigilancia (Tropical Weather Outlook) -------------------
      # Son las áreas que el NHC marca como posible formación en 2 y 7 días: avisan
      # antes de que la tormenta exista y tenga nombre. Van con continue-on-error
      # a propósito — si el GTWO falla, los ciclones activos igual se publican.
      - name: Bajar el GTWO del NHC
        id: gtwo
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p /tmp/gtwo
          curl --fail --silent --show-error --location \
            --max-time 30 \
            --user-agent "vigia-del-golfo/1.0 (github.com/mascochicle/experimentos)" \
            "https://www.nhc.noaa.gov/xgtwo/gtwo_shapefiles.zip" \
            -o /tmp/gtwo.zip
          echo "Bytes recibidos: $(wc -c < /tmp/gtwo.zip)"
          unzip -o -q /tmp/gtwo.zip -d /tmp/gtwo
          ls -1 /tmp/gtwo

      - name: Armar datos/vigilancia.json
        if: steps.gtwo.outcome == 'success'
        continue-on-error: true
        run: node .github/scripts/vigilancia.mjs /tmp/gtwo datos/vigilancia.json

      - name: Publicar si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/tormentas.json
          # Con "set -e" un test que falla tumba el paso, así que va con if completo.
          if [ -f datos/vigilancia.json ]; then git add datos/vigilancia.json; fi
          if git diff --staged --quiet; then
            echo "Sin cambios en el feed — no hay nada que publicar."
          else
            git commit -m "Datos de tormentas: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
