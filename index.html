<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vigía del Golfo</title>
<meta name="description" content="Ciclones activos, lluvia y tormentas en vivo sobre el Golfo, el Caribe y el Pacífico mexicano — con la distancia a Campeche.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8C%80%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
  :root{
    --ink:#0B1014; --panel:#12181Cf2; --panel-solid:#12181C; --line:#232B30;
    --text:#DCE4E4; --muted:#8B9A9F; --faint:#5B6A6F;
    --ok:#35C98F; --alerta:#E3A83B; --grave:#F2685C; --azul:#5B8CFF;
    --td:#58A6C9; --ts:#E3C64B; --c1:#E39A3B; --c2:#E3703B;
    --c3:#D9453F; --c4:#B5306B; --c5:#8E2FA0;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--ink); color:var(--text);
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    overflow:hidden;
  }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums; }
  .eyebrow{ font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif; font-weight:700;
            text-transform:uppercase; letter-spacing:.08em; font-size:.64rem; color:var(--muted); }

  #map{ position:absolute; inset:0; background:#0B1014; }
  .leaflet-pane.leaflet-base-pane{ filter:invert(100%) hue-rotate(180deg) brightness(96%) contrast(88%); }
  /* Los controles propios sustituyen a los de Leaflet: los de fábrica nacen arriba
     a la izquierda, justo debajo de la franja, y quedaban tapados. */
  .mandos{ position:absolute; right:12px; bottom:96px; z-index:1000;
           display:flex; flex-direction:column; align-items:flex-end; gap:7px; }
  .mando{ background:var(--panel); backdrop-filter:blur(6px); border:1px solid var(--line);
          color:var(--text); border-radius:8px; cursor:pointer; font-family:inherit;
          display:flex; align-items:center; justify-content:center; padding:0; }
  .mando:hover{ border-color:var(--azul); color:var(--azul); }
  .mando:focus-visible{ outline:2px solid var(--azul); outline-offset:2px; }
  #btnCasa{ gap:6px; padding:7px 11px; font-size:.74rem; font-weight:600; }
  #btnCasa svg{ flex:none; }
  .zoom{ display:flex; flex-direction:column; }
  .zoom button{ width:32px; height:30px; background:none; border:none; color:inherit;
                font-size:1rem; cursor:pointer; font-family:inherit; }
  .zoom button:hover{ color:var(--azul); }
  .zoom button:first-child{ border-bottom:1px solid var(--line); }
  .leaflet-control-attribution{ margin-bottom:0!important; }
  .leaflet-control-attribution{ background:rgba(18,24,28,.72)!important; color:var(--muted)!important; font-size:10px!important; }
  .leaflet-control-attribution a{ color:var(--muted)!important; }
  .leaflet-popup-content-wrapper,.leaflet-popup-tip{ background:var(--panel-solid); color:var(--text); border:1px solid var(--line); }
  .leaflet-popup-content{ margin:11px 13px; font-size:.82rem; }

  .float{ position:absolute; z-index:1000; background:var(--panel); backdrop-filter:blur(6px);
          border:1px solid var(--line); border-radius:8px; }

  /* ---- panel superior: una sola franja horizontal, plegable ----
     Antes era una columna lateral. En horizontal el mapa queda entero de lado a
     lado, que es lo que uno mira; las fichas caben en fila y se recorren de lado.
     Plegado deja solo la cabecera con el conteo. */
  .panel{ top:12px; left:12px; right:12px; display:flex; flex-direction:column; overflow:hidden; }

  .cabecera{ display:flex; align-items:center; gap:9px; padding:9px 12px 9px 14px; cursor:pointer;
             user-select:none; }
  .cabecera:hover{ background:#ffffff06; }
  .cabecera b{ font-size:.92rem; font-weight:600; white-space:nowrap; }
  .cabecera .punto{ width:7px; height:7px; border-radius:50%; background:var(--ok); flex:none; }
  @media (prefers-reduced-motion:no-preference){ .cabecera .punto{ animation:latir 1.8s ease-in-out infinite; } }
  @keyframes latir{ 0%,100%{opacity:1} 50%{opacity:.3} }
  .cabecera .resumen{ font-size:.74rem; color:var(--muted); flex:1; min-width:0;
                      overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cabecera .resumen b{ color:var(--text); font-weight:600; font-size:.74rem; }
  .cabecera .sello{ font-size:.68rem; color:var(--faint); white-space:nowrap; }
  .chevron{ background:none; border:none; color:var(--muted); font-size:.8rem; cursor:pointer;
            padding:2px 4px; flex:none; transition:transform .2s; }
  .panel.plegado .chevron{ transform:rotate(-90deg); }
  .panel.plegado .fichas{ display:none; }

  /* La franja: grupos lado a lado, cada uno con su rótulo y sus fichas en fila. */
  .fichas{ display:flex; align-items:flex-start; gap:16px; overflow-x:auto; overflow-y:hidden;
           padding:0 14px 13px; border-top:1px solid var(--line); padding-top:12px; }
  .grupo{ display:flex; flex-direction:column; gap:7px; flex:none; }
  .grupo + .grupo{ border-left:1px solid var(--line); padding-left:16px; }
  .rotulo{ font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif; font-weight:700;
           text-transform:uppercase; letter-spacing:.08em; font-size:.62rem; color:var(--muted);
           white-space:nowrap; }
  .rotulo span{ color:var(--faint); font-weight:400; text-transform:none; letter-spacing:0; }
  .fila{ display:flex; align-items:stretch; gap:9px; }

  .vacio{ border-left:3px solid var(--ok); padding:9px 11px; background:#35C98F14;
          font-size:.76rem; line-height:1.5; width:300px; border-radius:0 4px 4px 0; }
  .vacio b{ display:block; margin-bottom:2px; }

  /* ---- ficha (una tormenta o una zona) ---- */
  .tarjeta{ width:268px; flex:none; display:flex; flex-direction:column; cursor:pointer;
            background:#ffffff08; border:1px solid var(--line); border-radius:6px; padding:9px 11px 10px; }
  .tarjeta:hover{ background:#ffffff12; border-color:#33414a; }
  .tarjeta .fila1{ display:flex; align-items:center; gap:7px; }
  .tarjeta .cat{ font-size:.58rem; font-weight:700; letter-spacing:.05em; padding:2px 7px;
                 border-radius:99px; color:#0B1014; white-space:nowrap; flex:none; }
  .tarjeta .nom{ font-weight:600; font-size:.85rem; flex:1; min-width:0;
                 overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tarjeta .fila2{ margin-top:6px; font-size:.73rem; color:var(--muted); line-height:1.5; }
  .tarjeta .fila2 b{ color:var(--text); font-weight:600; }
  .tarjeta .rumbo{ margin-top:6px; font-size:.7rem; padding:5px 8px; border-radius:4px; line-height:1.4; }
  .tarjeta .rumbo.acerca{ background:#F2685C1c; color:var(--grave); }
  .tarjeta .rumbo.vigilar{ background:#E3A83B1c; color:var(--alerta); }
  .tarjeta .rumbo.aleja{ background:#35C98F14; color:var(--ok); }
  .tarjeta .pie{ margin-top:auto; padding-top:7px; }
  .tarjeta a{ color:var(--azul); font-size:.7rem; text-decoration:none; }
  .tarjeta a:hover{ text-decoration:underline; }

  /* probabilidad de formación a 48 h y 7 días */
  .barras{ display:flex; gap:6px; margin-top:7px; }
  .plazo{ flex:1; background:#ffffff0a; border-radius:4px; padding:5px 7px; }
  .plazo .et{ font-size:.56rem; color:var(--faint); text-transform:uppercase;
              letter-spacing:.06em; font-weight:700; }
  .plazo .pc{ font-size:.9rem; font-weight:700; line-height:1.25; }
  .riel{ height:3px; border-radius:99px; background:#ffffff14; margin-top:4px; overflow:hidden; }
  .riel i{ display:block; height:100%; border-radius:99px; }
  .r-bajo{ color:var(--ts); } .r-medio{ color:var(--c1); } .r-alto{ color:var(--c3); }
  .f-bajo{ background:var(--ts); } .f-medio{ background:var(--c1); } .f-alto{ background:var(--c3); }

  /* El texto del NHC no cabe en una ficha de altura fija: vive en el popup. */
  .popup-nhc{ margin:7px 0 0; padding:7px 0 0; border-top:1px solid var(--line);
              font-size:.72rem; line-height:1.5; color:var(--muted);
              max-height:118px; overflow-y:auto; }
  .leaflet-popup-content{ max-width:262px; }

  /* línea de tiempo del radar */
  .tiempo{ bottom:12px; left:12px; right:12px; padding:9px 13px 11px; display:flex; flex-direction:column; gap:6px; }
  .tiempo .fila{ display:flex; align-items:center; gap:10px; }
  #btnPlay{ background:var(--panel-solid); border:1px solid var(--line); color:var(--text); border-radius:50%;
            width:32px; height:32px; flex:none; font-size:.9rem; cursor:pointer;
            display:flex; align-items:center; justify-content:center; }
  #btnPlay:hover{ border-color:var(--azul); }
  #barra{ flex:1; accent-color:var(--azul); }
  .tiempo .meta{ display:flex; justify-content:space-between; align-items:baseline; font-size:.74rem; gap:10px; }
  .insignia{ font-size:.6rem; font-weight:700; letter-spacing:.05em; padding:2px 8px; border-radius:99px; }
  .insignia.pasado{ background:#35C98F1c; color:var(--ok); }
  .insignia.futuro{ background:#E3A83B1c; color:var(--alerta); }

  .cargando{ position:absolute; inset:0; z-index:2000; display:flex; align-items:center; justify-content:center;
             background:var(--ink); flex-direction:column; gap:9px; transition:opacity .4s; }
  .cargando.fuera{ opacity:0; pointer-events:none; }

  @media(max-width:720px){
    /* En celular la franja se queda arriba igual, pero más compacta: el sello de
       la hora estorba y los grupos se apilan para no pelear con el ancho. */
    .cabecera b{ font-size:.82rem; }
    .cabecera .sello{ display:none; }
    .panel{ max-height:62vh; }
    .fichas{ flex-direction:column; align-items:stretch; gap:12px; overflow-y:auto; }
    .grupo + .grupo{ border-left:none; padding-left:0; border-top:1px solid var(--line); padding-top:12px; }
    .fila{ overflow-x:auto; padding-bottom:2px; }
    .tarjeta{ width:252px; }
    .vacio{ width:auto; }
    /* En celular el botón se queda con el ícono: la palabra no cabe junto al mapa. */
    #btnCasa span{ display:none; }
    #btnCasa{ width:32px; height:32px; padding:0; }
  }
</style>
</head>
<body>

<div id="map"></div>

<div class="cargando" id="cargando">
  <div class="eyebrow">Vigía del Golfo</div>
  <div class="mono" style="font-size:.78rem;color:var(--muted)">cargando radar y ciclones…</div>
</div>

<div class="float panel" id="panel">
  <div class="cabecera" id="cabecera" role="button" tabindex="0"
       aria-expanded="true" aria-controls="fichas">
    <span class="punto"></span><b>Vigía del Golfo</b>
    <span class="resumen" id="resumen">cargando…</span>
    <span class="sello mono" id="sello">—</span>
    <button class="chevron" id="chevron" aria-hidden="true" tabindex="-1">▾</button>
  </div>

  <div class="fichas" id="fichas">
    <div class="grupo">
      <div class="rotulo">Ciclones activos <span>· fuente NHC</span></div>
      <div class="fila" id="listaTormentas"></div>
    </div>
    <div class="grupo">
      <div class="rotulo">Zonas en vigilancia <span>· dónde podría formarse algo</span></div>
      <div class="fila" id="listaVigilancia"></div>
    </div>
  </div>
</div>

<div class="mandos">
  <button class="mando" id="btnCasa" title="Volver a Campeche">
    <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor"
         stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
      <circle cx="8" cy="8" r="3.1"/>
      <path d="M8 1v2.3M8 12.7V15M1 8h2.3M12.7 8H15"/>
    </svg>
    <span>Campeche</span>
  </button>
  <div class="mando zoom">
    <button id="btnMas" title="Acercar" aria-label="Acercar">+</button>
    <button id="btnMenos" title="Alejar" aria-label="Alejar">−</button>
  </div>
</div>

<div class="float tiempo">
  <div class="fila">
    <button id="btnPlay" aria-label="Reproducir radar">▶</button>
    <input type="range" id="barra" min="0" max="0" value="0" step="1">
  </div>
  <div class="meta">
    <span class="insignia pasado mono" id="insignia">—</span>
    <span class="mono" id="horaCuadro">—</span>
    <span class="eyebrow" id="cuentaCuadros">— / —</span>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  "use strict";

  var CAMPECHE = [19.845, -90.54];

  // ---------------- panel plegable ----------------
  // Plegado deja el mapa completo y la cabecera sigue diciendo lo importante, así
  // que el resumen tiene que bastar por sí solo: conteos y, si algo apunta hacia
  // acá, el nombre en rojo.
  var panel = document.getElementById("panel");
  var cabecera = document.getElementById("cabecera");
  var LLAVE_PLEGADO = "vigia-plegado";

  // guardar=false es para los plegados automáticos: no deben cambiar cómo abre la
  // página la próxima vez, eso solo lo decide quien le da clic a la cabecera.
  function plegar(si, guardar){
    panel.classList.toggle("plegado", si);
    cabecera.setAttribute("aria-expanded", si ? "false" : "true");
    if(guardar === false) return;
    try{ localStorage.setItem(LLAVE_PLEGADO, si ? "1" : "0"); }catch(e){}
  }
  // En celular la franja desplegada ocupa más de media pantalla, así que al ir a
  // un lugar del mapa se pliega sola; si no, queda una rendija donde centrarlo.
  var PANTALLA_ANGOSTA = window.matchMedia("(max-width:720px)");
  function hacerLugar(){
    if(PANTALLA_ANGOSTA.matches) plegar(true, false);
  }
  cabecera.addEventListener("click", function(){
    plegar(!panel.classList.contains("plegado"));
  });
  cabecera.addEventListener("keydown", function(e){
    if(e.key === "Enter" || e.key === " "){
      e.preventDefault();
      plegar(!panel.classList.contains("plegado"));
    }
  });
  // El navegador puede negar localStorage (modo privado); si pasa, abre y ya.
  try{ if(localStorage.getItem(LLAVE_PLEGADO) === "1") plegar(true); }catch(e){}

  // La franja flota sobre el mapa, así que al encuadrar hay que descontarla o el
  // popup nace debajo de ella. Abajo se descuenta la línea de tiempo del radar.
  // Se miden los elementos reales en vez de usar números fijos: la franja y la
  // línea de tiempo cambian de alto entre escritorio, celular, plegado y abierto,
  // y con constantes Campeche quedaba corrido 14 px en el celular.
  function alturaFranja(){
    return Math.round(panel.getBoundingClientRect().bottom) + 10;
  }
  function alturaAbajo(){
    var t = document.querySelector(".tiempo");
    return t ? Math.round(window.innerHeight - t.getBoundingClientRect().top) + 10 : 96;
  }
  function margenes(lado){
    return {
      paddingTopLeft: [lado, alturaFranja()],
      paddingBottomRight: [lado, alturaAbajo()],
      maxZoom: 6,
      // Sin animación a propósito: el popup se abre enseguida, y con el encuadre
      // todavía corriendo su autoPan peleaba con él y la zona quedaba descentrada.
      animate: false
    };
  }

  // Encuadra algo y le abre su globo, dejándolo dentro de la parte visible del
  // mapa (la que no tapan ni la franja de arriba ni la línea de tiempo de abajo).
  function enfocar(capa, limites, ancla, lado){
    hacerLugar(); // antes de medir la franja, para encuadrar con la altura ya plegada
    var globo = capa.getPopup();
    if(globo){
      globo.options.autoPanPaddingTopLeft = L.point(24, alturaFranja() + 10);
      globo.options.autoPanPaddingBottomRight = L.point(24, alturaAbajo() + 10);
    }
    map.fitBounds(limites, margenes(lado));
    if(ancla) capa.openPopup(L.latLng(ancla[0], ancla[1]));
    else capa.openPopup();
  }

  var conteo = { ciclones:null, zonas:null, alerta:null };
  function plural(n, uno, varios){ return n + " " + (n === 1 ? uno : varios); }
  function actualizarResumen(){
    var partes = [];
    if(conteo.ciclones !== null){
      partes.push(conteo.ciclones === 0 ? "sin ciclones activos"
                                        : "<b>" + plural(conteo.ciclones, "ciclón activo", "ciclones activos") + "</b>");
    }
    if(conteo.zonas !== null){
      partes.push(conteo.zonas === 0 ? "nada en formación"
                                     : plural(conteo.zonas, "zona en vigilancia", "zonas en vigilancia"));
    }
    var texto = partes.join(" · ") || "cargando…";
    if(conteo.alerta){
      texto = '<b style="color:var(--grave)">' + conteo.alerta + ' apunta hacia acá</b> · ' + texto;
    }
    document.getElementById("resumen").innerHTML = texto;
  }

  // ---------------- mapa ----------------
  var map = L.map("map", { zoomControl:false, attributionControl:true }).setView([21, -88], 5);

  map.createPane("basePane");
  map.getPane("basePane").classList.add("leaflet-base-pane");
  map.getPane("basePane").style.zIndex = 150;
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19, pane: "basePane"
  }).addTo(map);
  map.attributionControl.addAttribution(
    'Radar: <a href="https://www.rainviewer.com/" target="_blank" rel="noopener">RainViewer</a> · ' +
    'Ciclones: <a href="https://www.nhc.noaa.gov/" target="_blank" rel="noopener">NOAA/NHC</a>'
  );

  // Las zonas de vigilancia van encima del radar pero debajo de los ciclones:
  // son contexto, no el dato principal.
  map.createPane("zonaPane");
  map.getPane("zonaPane").style.zIndex = 620;

  map.createPane("ciclonPane");
  map.getPane("ciclonPane").style.zIndex = 650;

  function colorVar(nombre){
    return getComputedStyle(document.documentElement).getPropertyValue(nombre).trim();
  }

  // referencia: casa
  L.circleMarker(CAMPECHE, {
    radius:5, color:"#DCE4E4", weight:2, fillColor:"#0B1014", fillOpacity:1, pane:"ciclonPane"
  }).addTo(map).bindPopup("<b>Campeche</b><br>punto de referencia");

  // ---------------- mandos del mapa ----------------
  // Vista de casa: Campeche al centro, con el zoom de arranque. El botón existe
  // porque al saltar a una zona lejana no había forma obvia de regresar, y los
  // controles de Leaflet nacían debajo de la franja.
  //
  // Zoom fijo en vez de encuadrar un rectángulo: el rectángulo no cabe en el
  // ancho de un celular y Leaflet se alejaba hasta mostrar medio continente.
  var ZOOM_CASA = 5;
  function centrarEn(punto, zoom){
    // El centro que se ve no es el centro del mapa: arriba lo tapa la franja y
    // abajo la línea de tiempo. Se corre el centro para compensar la diferencia.
    var desfase = (alturaFranja() - alturaAbajo()) / 2;
    var p = map.project(L.latLng(punto[0], punto[1]), zoom).subtract([0, desfase]);
    map.setView(map.unproject(p, zoom), zoom, {animate:false});
  }
  document.getElementById("btnCasa").addEventListener("click", function(){
    map.closePopup();
    hacerLugar();
    centrarEn(CAMPECHE, ZOOM_CASA);
  });
  document.getElementById("btnMas").addEventListener("click", function(){ map.zoomIn(); });
  document.getElementById("btnMenos").addEventListener("click", function(){ map.zoomOut(); });

  // ---------------- radar (RainViewer) ----------------
  var TAM = (window.devicePixelRatio||1) >= 2 ? 512 : 256;
  var OPCIONES = "1_1";
  // Paleta NEXRAD Level III (verde→amarillo→rojo→magenta). El número va literal en la URL
  // de la tesela y respeta la numeración documentada por RainViewer. Se eligió sobre la
  // Universal Blue (2) porque su extremo bajo se pierde contra el mapa oscuro: con azul,
  // la lluvia ligera quedaba casi invisible.
  var ESQUEMA = 6;
  var cuadros = [], capaA = null, capaB = null, activaEsA = true;
  var iCuadro = 0, corriendo = false, cronometro = null, host = "";

  function urlCuadro(c){ return host + c.path + "/" + TAM + "/{z}/{x}/{y}/" + ESQUEMA + "/" + OPCIONES + ".png"; }
  function hhmm(seg){ return new Date(seg*1000).toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"}); }

  function ultimoPasado(){
    for(var i=cuadros.length-1;i>=0;i--){ if(cuadros[i].tipo==="pasado") return i; }
    return cuadros.length-1;
  }

  function mostrar(i){
    if(!cuadros.length) return;
    i = ((i % cuadros.length) + cuadros.length) % cuadros.length;
    iCuadro = i;
    var c = cuadros[i];
    var entra = activaEsA ? capaB : capaA;
    var sale  = activaEsA ? capaA : capaB;
    entra.setUrl(urlCuadro(c)); entra.setOpacity(0.85);
    if(sale) sale.setOpacity(0);
    activaEsA = !activaEsA;

    document.getElementById("barra").value = i;
    document.getElementById("horaCuadro").textContent = hhmm(c.time);
    document.getElementById("cuentaCuadros").textContent = (i+1) + " / " + cuadros.length;
    var ins = document.getElementById("insignia");
    if(c.tipo === "futuro"){ ins.textContent = "PRONÓSTICO"; ins.className = "insignia futuro mono"; }
    else { ins.textContent = (i === ultimoPasado()) ? "AHORA" : "PASADO"; ins.className = "insignia pasado mono"; }
  }

  function reproducir(){
    corriendo = true;
    document.getElementById("btnPlay").textContent = "⏸";
    clearInterval(cronometro);
    cronometro = setInterval(function(){ mostrar(iCuadro+1); }, 650);
  }
  function pausar(){
    corriendo = false;
    document.getElementById("btnPlay").textContent = "▶";
    clearInterval(cronometro);
  }
  document.getElementById("btnPlay").addEventListener("click", function(){ corriendo ? pausar() : reproducir(); });
  document.getElementById("barra").addEventListener("input", function(e){ pausar(); mostrar(+e.target.value); });


  function cargarRadar(){
    fetch("https://api.rainviewer.com/public/weather-maps.json")
      .then(function(r){ return r.json(); })
      .then(function(d){
        host = d.host;
        var pasado = (d.radar && d.radar.past) || [];
        var futuro = (d.radar && d.radar.nowcast) || [];
        cuadros = pasado.map(function(f){ return {time:f.time, path:f.path, tipo:"pasado"}; })
          .concat(futuro.map(function(f){ return {time:f.time, path:f.path, tipo:"futuro"}; }));
        document.getElementById("barra").max = Math.max(0, cuadros.length-1);
        if(!capaA){
          capaA = L.tileLayer("", {tileSize:256, opacity:0, maxNativeZoom:7, maxZoom:19}).addTo(map);
          capaB = L.tileLayer("", {tileSize:256, opacity:0, maxNativeZoom:7, maxZoom:19}).addTo(map);
        }
        mostrar(ultimoPasado());
        document.getElementById("cargando").classList.add("fuera");
      })
      .catch(function(){
        document.getElementById("cargando").classList.add("fuera");
        document.getElementById("horaCuadro").textContent = "radar no disponible";
      });
  }

  // ---------------- ciclones (archivo propio, sin CORS de por medio) ----------------
  var capaCiclones = L.layerGroup([], {pane:"ciclonPane"}).addTo(map);
  var RUMBOS = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSO","SO","OSO","O","ONO","NO","NNO"];

  function aRumbo(g){ return RUMBOS[Math.round(((g%360)+360)%360 / 22.5) % 16]; }
  function kmh(kt){ return Math.round(kt * 1.852); }
  function rad(d){ return d * Math.PI / 180; }

  function distanciaKm(a, b){
    var R = 6371;
    var dLat = rad(b[0]-a[0]), dLon = rad(b[1]-a[1]);
    var s = Math.sin(dLat/2)*Math.sin(dLat/2) +
            Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLon/2)*Math.sin(dLon/2);
    return Math.round(2*R*Math.asin(Math.sqrt(s)));
  }
  function azimut(desde, hacia){
    var y = Math.sin(rad(hacia[1]-desde[1])) * Math.cos(rad(hacia[0]));
    var x = Math.cos(rad(desde[0]))*Math.sin(rad(hacia[0])) -
            Math.sin(rad(desde[0]))*Math.cos(rad(hacia[0]))*Math.cos(rad(hacia[1]-desde[1]));
    return (Math.atan2(y,x) * 180/Math.PI + 360) % 360;
  }
  function difAngulo(a, b){
    var d = Math.abs(a-b) % 360;
    return d > 180 ? 360-d : d;
  }

  // Categoría por viento sostenido en nudos (escala Saffir-Simpson).
  function categoria(clasificacion, kt){
    if(clasificacion === "HU" || clasificacion === "MH" || kt >= 64){
      if(kt >= 137) return {txt:"CAT 5", color:"var(--c5)"};
      if(kt >= 113) return {txt:"CAT 4", color:"var(--c4)"};
      if(kt >= 96)  return {txt:"CAT 3", color:"var(--c3)"};
      if(kt >= 83)  return {txt:"CAT 2", color:"var(--c2)"};
      return {txt:"CAT 1", color:"var(--c1)"};
    }
    if(clasificacion === "TS" || clasificacion === "STS" || kt >= 34) return {txt:"T. TROPICAL", color:"var(--ts)"};
    if(clasificacion === "PTC") return {txt:"POTENCIAL", color:"var(--td)"};
    return {txt:"DEPRESIÓN", color:"var(--td)"};
  }

  function pintarCiclones(datos){
    var lista = document.getElementById("listaTormentas");
    capaCiclones.clearLayers();
    var tormentas = (datos && datos.tormentas) || [];

    conteo.ciclones = tormentas.length;
    conteo.alerta = null;

    if(!tormentas.length){
      lista.innerHTML =
        '<div class="vacio"><b>Sin ciclones activos</b>' +
        'Ningún sistema tropical con aviso vigente del NHC. El radar sigue normal.</div>';
      actualizarResumen();
      return;
    }

    lista.innerHTML = tormentas.map(function(t, idx){
      var cat = categoria(t.clasificacion, t.intensidadKt);
      var d = distanciaKm(CAMPECHE, [t.lat, t.lon]);
      var azCampeche = azimut(CAMPECHE, [t.lat, t.lon]);
      // ¿Su rumbo actual apunta hacia Campeche? Se compara contra el azimut de regreso.
      // Ojo: es geometría del rumbo de este momento, NO un pronóstico de trayectoria.
      var apunta = isFinite(t.rumboGrados) &&
                   difAngulo(t.rumboGrados, (azCampeche + 180) % 360) < 50;
      var nivel = !apunta ? "aleja" : (d < 1500 ? "acerca" : "vigilar");
      var textoRumbo = {
        acerca:  "Su rumbo actual apunta hacia acá y está cerca — checa el cono oficial.",
        vigilar: "Apunta en esta dirección, pero todavía está lejos. Hay que seguirlo.",
        aleja:   "Su rumbo actual no apunta hacia Campeche."
      }[nivel];
      var rumboTxt = isFinite(t.rumboGrados)
        ? "se mueve al <b>" + aRumbo(t.rumboGrados) + "</b> a <b>" + kmh(t.velocidadKt) + " km/h</b>"
        : "sin dato de movimiento";
      // Lo que vale la pena ver con el panel plegado.
      if(nivel === "acerca" && !conteo.alerta) conteo.alerta = t.nombre;
      return '' +
        '<div class="tarjeta" data-i="' + idx + '">' +
          '<div class="fila1">' +
            '<span class="cat" style="background:' + cat.color + '">' + cat.txt + '</span>' +
            '<span class="nom">' + t.nombre + '</span>' +
          '</div>' +
          '<div class="fila2">' +
            'Vientos <b>' + kmh(t.intensidadKt) + ' km/h</b> · ' + (isFinite(t.presionMb) ? t.presionMb + ' mb' : '—') + '<br>' +
            'A <b>' + d.toLocaleString("es-MX") + ' km</b> de Campeche, al <b>' + aRumbo(azCampeche) + '</b><br>' +
            rumboTxt +
          '</div>' +
          '<div class="rumbo ' + nivel + '">' + textoRumbo + '</div>' +
          (t.graficas
            ? '<div class="pie"><a href="' + t.graficas + '" target="_blank" rel="noopener">' +
              'Cono y avisos oficiales →</a></div>'
            : '') +
        '</div>';
    }).join("");
    actualizarResumen();

    tormentas.forEach(function(t, idx){
      var cat = categoria(t.clasificacion, t.intensidadKt);
      var color = getComputedStyle(document.documentElement)
        .getPropertyValue(cat.color.replace("var(","").replace(")","")).trim() || "#E3C64B";
      var m = L.circleMarker([t.lat, t.lon], {
        radius: 9, color:"#0B1014", weight:2, fillColor:color, fillOpacity:.95, pane:"ciclonPane"
      }).addTo(capaCiclones);
      m.bindPopup(
        "<b>" + t.nombre + "</b> — " + cat.txt + "<br>" +
        "Vientos " + kmh(t.intensidadKt) + " km/h<br>" +
        "A " + distanciaKm(CAMPECHE, [t.lat, t.lon]).toLocaleString("es-MX") + " km de Campeche"
      );
      // halo proporcional a la intensidad, para que se lea de un vistazo en el mapa
      L.circleMarker([t.lat, t.lon], {
        radius: 9 + Math.min(26, t.intensidadKt/4), color:color, weight:1.5,
        opacity:.5, fill:false, pane:"ciclonPane"
      }).addTo(capaCiclones);
      var tarjeta = document.querySelector('.tarjeta[data-i="' + idx + '"]');
      if(tarjeta){
        tarjeta.addEventListener("click", function(){
          enfocar(m, L.latLngBounds([t.lat, t.lon], [t.lat, t.lon]), null, 30);
        });
      }
    });
  }

  // -------- zonas de vigilancia (Tropical Weather Outlook del NHC) --------
  // Áreas donde el NHC ve posibilidad de que se forme un ciclón en 2 o 7 días.
  // Aparecen ANTES de que exista la tormenta, así que es el aviso más temprano
  // que hay. Los colores son los mismos del NHC: amarillo bajo, naranja medio,
  // rojo alto.
  var capaZonas = L.layerGroup([], {pane:"zonaPane"}).addTo(map);
  var COLOR_RIESGO = { bajo:"--ts", medio:"--c1", alto:"--c3" };

  function pintarZonas(datos){
    var lista = document.getElementById("listaVigilancia");
    capaZonas.clearLayers();
    var zonas = (datos && datos.zonas) || [];

    conteo.zonas = zonas.length;

    if(!zonas.length){
      var cuencas = (datos && datos.cuencasSinFormacion) || [];
      lista.innerHTML =
        '<div class="vacio"><b>Nada en formación</b>' +
        (cuencas.length
          ? 'El NHC no espera que se forme un ciclón en los próximos 7 días en: ' +
            cuencas.join(" ni ") + '.'
          : 'No hay áreas marcadas como posible formación en este momento.') +
        '</div>';
      actualizarResumen();
      return;
    }

    lista.innerHTML = zonas.map(function(z, idx){
      var riesgo = z.riesgo7dias || z.riesgo2dias || "bajo";
      var d = z.centro ? distanciaKm(CAMPECHE, z.centro) : null;
      var rumboA = z.centro ? aRumbo(azimut(CAMPECHE, z.centro)) : null;

      function plazo(etiqueta, pct, nivel){
        var n = nivel || "bajo";
        return '' +
          '<div class="plazo">' +
            '<div class="et">' + etiqueta + '</div>' +
            '<div class="pc r-' + n + '">' + (pct === null ? "—" : pct + "%") + '</div>' +
            '<div class="riel"><i class="f-' + n + '" style="width:' + (pct || 0) + '%"></i></div>' +
          '</div>';
      }

      return '' +
        '<div class="tarjeta" data-z="' + idx + '">' +
          '<div class="fila1">' +
            '<span class="cat" style="background:var(' + (COLOR_RIESGO[riesgo] || "--ts") + ')">' +
              riesgo.toUpperCase() + '</span>' +
            '<span class="nom">' + z.titulo + '</span>' +
          '</div>' +
          '<div class="barras">' +
            plazo("48 horas", z.prob2dias, z.riesgo2dias) +
            plazo("7 días", z.prob7dias, z.riesgo7dias) +
          '</div>' +
          (d !== null
            ? '<div class="fila2">Su centro está a <b>' + d.toLocaleString("es-MX") +
              ' km</b> de Campeche, al <b>' + rumboA + '</b></div>'
            : '') +
          (z.boletin
            ? '<div class="pie"><a href="' + z.boletin + '" target="_blank" ' +
              'rel="noopener">Pronóstico completo del NHC →</a></div>'
            : '') +
        '</div>';
    }).join("");
    actualizarResumen();

    zonas.forEach(function(z, idx){
      if(!z.anillos || !z.anillos.length) return;
      var riesgo = z.riesgo7dias || z.riesgo2dias || "bajo";
      var color = colorVar(COLOR_RIESGO[riesgo] || "--ts") || "#E3C64B";
      // Relleno tenue y borde punteado: es un área de posibilidad, no un objeto
      // real, y además debajo tiene que seguir viéndose el radar.
      var poli = L.polygon(z.anillos, {
        color: color, weight: 1.6, dashArray: "5 4", opacity: .9,
        fillColor: color, fillOpacity: .12, pane: "zonaPane"
      }).addTo(capaZonas);
      // El párrafo del NHC va aquí y no en la ficha: es largo y variable, y en una
      // franja de altura pareja desacomodaría todo. Va en inglés a propósito.
      poli.bindPopup(
        "<b>" + z.titulo + "</b><br>" +
        "Formación: " + (z.prob2dias === null ? "—" : z.prob2dias + "%") + " en 48 h · " +
        (z.prob7dias === null ? "—" : z.prob7dias + "%") + " en 7 días<br>" +
        (z.centro ? "A " + distanciaKm(CAMPECHE, z.centro).toLocaleString("es-MX") + " km de Campeche" : "") +
        (z.descripcion ? '<div class="popup-nhc">' + z.descripcion + "</div>" : "")
      );
      var tarjeta = document.querySelector('.tarjeta[data-z="' + idx + '"]');
      if(tarjeta){
        tarjeta.addEventListener("click", function(e){
          if(e.target.closest("a")) return; // no secuestrar la liga al boletín
          // El globo se ancla al punto que marca el NHC, no al centro geométrico
          // del polígono: en áreas alargadas no son el mismo lugar.
          enfocar(poli, poli.getBounds(), z.centro, 40);
        });
      }
    });
  }

  function cargarVigilancia(){
    fetch("datos/vigilancia.json?t=" + Date.now())
      .then(function(r){
        if(!r.ok) throw new Error("sin archivo");
        return r.json();
      })
      .then(pintarZonas)
      .catch(function(){
        // Que falte este archivo no es un error de la página: el workflow pudo no
        // haber corrido todavía, o el GTWO pudo no estar disponible.
        document.getElementById("listaVigilancia").innerHTML =
          '<div class="vacio" style="border-left-color:var(--faint);background:#ffffff08">' +
          '<b>Sin datos de vigilancia</b>Todavía no hay un pronóstico de formación ' +
          'descargado. Se actualiza junto con los ciclones.</div>';
        conteo.zonas = null;
        actualizarResumen();
      });
  }

  function cargarCiclones(){
    fetch("datos/tormentas.json?t=" + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(d){
        pintarCiclones(d);
        document.getElementById("sello").textContent = d.generado
          ? "ciclones: " + new Date(d.generado).toLocaleString("es-MX",{hour12:false, dateStyle:"short", timeStyle:"short"})
          : "ciclones: esperando primera corrida";
      })
      .catch(function(){
        document.getElementById("listaTormentas").innerHTML =
          '<div class="vacio" style="border-left-color:var(--grave);background:#F2685C14">' +
          '<b>No se pudo leer el archivo de ciclones</b>Revisa que el workflow haya corrido al menos una vez.</div>';
        conteo.ciclones = null;
        conteo.alerta = null;
        actualizarResumen();
      });
  }

  cargarRadar();
  cargarCiclones();
  cargarVigilancia();
  setInterval(cargarRadar, 5*60*1000);
  setInterval(cargarCiclones, 10*60*1000);
  setInterval(cargarVigilancia, 10*60*1000);
})();
</script>
</body>
